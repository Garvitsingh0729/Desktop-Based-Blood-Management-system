<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Contact - Blood Management</title><link rel="stylesheet" href="styles.css"></head>
<body class="theme">
<header class="topbar"><img src="images/logo.svg" class="logo"><nav><a href="home.html">Home</a><a href="about.html">About Us</a></nav></header>

<main class="card center">
  <h2>Contact Us</h2>
  <form id="contactForm">
    <label>Name<input type="text" id="contactName" required></label>
    <label>Email<input type="email" id="contactEmail" required></label>
    <label>Message<textarea id="contactMsg" rows="4" required></textarea></label>
    <button type="submit" class="primary">Send Message</button>
  </form>

  <h3>Quick WhatsApp</h3>
  <p>Contact via WhatsApp: <a id="waLink" href="https://wa.me/919999999999" target="_blank">Chat on WhatsApp</a></p>
</main>

<script src="script.js"></script>
</body>
</html>
