<!doctype html>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Register Seeker - Blood Management</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="theme">
  <header class="topbar"><img src="images/logo.svg" class="logo"><nav><a href="index.html">Home</a></nav></header>

  <main class="card center">
    <h2>Blood Seeker Registration</h2>
    <form id="seekerForm">
      <label>Full name<input type="text" id="seekerName" required></label>
      <label>Email<input type="email" id="seekerEmail" required></label>
      <label>Phone<input type="tel" id="seekerPhone" required></label>
      <label>Required Blood Group
        <select id="seekerBg">
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </label>
      <label>City<input type="text" id="seekerCity" required></label>
      <button class="primary" type="submit">Register as Seeker</button>
    </form>
  </main>

<script src="script.js"></script>
</body>
</html>
